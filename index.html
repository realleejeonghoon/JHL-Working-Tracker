<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>worklog — 작업 시간 트래커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --g1:rgba(255,255,255,0.07);
  --g2:rgba(255,255,255,0.04);
  --gb:rgba(255,255,255,0.13);
  --gb2:rgba(255,255,255,0.22);
  --gold:#d4a96a;--gold2:#f0c882;--blue:#8fb3d4;--green:#7ec49a;--red:#d47a7a;--purple:#a88ed4;
  --t1:#f2eed9;--t2:rgba(242,238,217,0.65);--t3:rgba(242,238,217,0.35);
  --r:18px;--r2:14px;
}
body{font-family:'Pretendard',sans-serif;background:#0d0d18;color:var(--t1);min-height:100vh;overflow-x:hidden;}
.bg-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;}
.o1{width:600px;height:600px;top:-200px;right:-100px;background:radial-gradient(circle,rgba(180,120,60,0.18) 0%,transparent 70%);}
.o2{width:500px;height:500px;bottom:-150px;left:-100px;background:radial-gradient(circle,rgba(60,100,180,0.15) 0%,transparent 70%);}
.o3{width:300px;height:300px;top:40%;left:40%;background:radial-gradient(circle,rgba(100,60,180,0.1) 0%,transparent 70%);}
.app{position:relative;z-index:1;display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr;gap:16px;min-height:100vh;padding:20px;max-width:1080px;margin:0 auto;}
.glass{background:var(--g1);border:1px solid var(--gb);border-radius:var(--r);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);}
.glass-light{background:rgba(255,255,255,0.1);border:1px solid var(--gb2);border-radius:var(--r2);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);}
.glass-inner{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;}
.sidebar{grid-row:1/3;padding:22px 16px;display:flex;flex-direction:column;gap:4px;overflow:hidden;}
.logo{font-size:17px;font-weight:600;color:var(--gold);letter-spacing:-0.3px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:8px;}
.logo small{display:block;font-size:11px;font-weight:300;color:var(--t3);letter-spacing:0.5px;margin-top:2px;}
.nav-btn{width:100%;text-align:left;background:none;border:none;color:var(--t2);font-family:inherit;font-size:13px;padding:9px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:9px;transition:all .2s;}
.nav-btn i{font-size:16px;width:18px;}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:var(--t1);}
.nav-btn.on{background:rgba(212,169,106,0.18);color:var(--gold);border:1px solid rgba(212,169,106,0.25);}
.sec-label{font-size:10px;letter-spacing:.1em;color:var(--t3);padding:12px 12px 4px;text-transform:uppercase;}
.tag-li{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:12px;color:var(--t2);transition:background .15s;}
.tag-li:hover{background:rgba(255,255,255,0.06);}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sb-space{flex:1;}
.add-main{width:100%;padding:10px;background:rgba(212,169,106,0.2);border:1px solid rgba(212,169,106,0.35);border-radius:11px;color:var(--gold);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .2s;}
.add-main:hover{background:rgba(212,169,106,0.32);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.topbar h1{font-size:20px;font-weight:500;letter-spacing:-0.5px;}
.tabs{display:flex;gap:6px;}
.tab{padding:7px 14px;border-radius:9px;font-size:12px;background:var(--g1);border:1px solid var(--gb);color:var(--t2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s;}
.tab:hover{background:rgba(255,255,255,0.08);}
.tab.on{background:rgba(212,169,106,0.2);border-color:rgba(212,169,106,0.35);color:var(--gold);}
.main{display:flex;flex-direction:column;gap:14px;}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;}
.stat{padding:16px 16px 14px;position:relative;overflow:hidden;}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);}
.stat-lbl{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;margin-bottom:7px;}
.stat-lbl i{font-size:13px;}
.stat-num{font-size:24px;font-weight:500;letter-spacing:-1px;line-height:1;}
.stat-hint{font-size:11px;color:var(--t3);margin-top:4px;}
.up{color:#7ec49a;}.dn{color:var(--red);}
.mid{display:grid;grid-template-columns:1fr 280px;gap:14px;}
.cal-wrap{padding:20px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-title{font-size:15px;font-weight:500;}
.cal-nav{display:flex;gap:5px;}
.cal-nav button{width:28px;height:28px;border-radius:8px;background:var(--g2);border:1px solid var(--gb);color:var(--t2);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.cal-nav button:hover{background:rgba(255,255,255,0.1);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.dow{font-size:10px;color:var(--t3);text-align:center;padding:3px 0 7px;}
.day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s;gap:2px;}
.day:hover{background:rgba(255,255,255,0.08);}
.day.td{background:rgba(212,169,106,0.2);color:var(--gold);font-weight:600;}
.day.sel{background:rgba(212,169,106,0.28);border:1px solid rgba(212,169,106,0.45);}
.day.oth{color:var(--t3);}
.cd{width:4px;height:4px;border-radius:50%;}
.panel{display:flex;flex-direction:column;gap:12px;}
.pcard{padding:16px;}
.pcard-title{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;margin-bottom:11px;text-transform:uppercase;letter-spacing:.08em;}
.pcard-title i{font-size:13px;}
.timer-display{text-align:center;padding:8px 0 4px;}
.timer-num{font-size:36px;font-weight:300;letter-spacing:-1px;color:var(--t1);font-variant-numeric:tabular-nums;}
.timer-task{font-size:12px;color:var(--t3);margin-top:4px;min-height:16px;}
.timer-btns{display:flex;gap:8px;margin-top:12px;}
.tbtn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--gb);background:var(--g2);color:var(--t1);font-size:13px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;}
.tbtn:hover{background:rgba(255,255,255,0.09);}
.tbtn.start{background:rgba(126,196,154,0.2);border-color:rgba(126,196,154,0.35);color:var(--green);}
.tbtn.stop{background:rgba(212,122,122,0.2);border-color:rgba(212,122,122,0.35);color:var(--red);}
.tbtn.save-t{background:rgba(212,169,106,0.2);border-color:rgba(212,169,106,0.35);color:var(--gold);}
.task-li{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:background .15s;border-radius:6px;padding-left:4px;}
.task-li:last-child{border-bottom:none;}
.task-li:hover{background:rgba(255,255,255,0.04);}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(255,255,255,0.2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer;}
.chk.done{background:var(--green);border-color:var(--green);}
.ti-name{font-size:13px;line-height:1.3;flex:1;}
.ti-name.done{color:var(--t3);text-decoration:line-through;}
.ti-meta{font-size:10px;color:var(--t3);margin-top:2px;display:flex;gap:7px;align-items:center;}
.ctag{font-size:10px;padding:1px 7px;border-radius:4px;font-weight:500;}
.eff-row{margin-bottom:10px;}
.eff-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
.eff-bg{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.eff-fill{height:100%;border-radius:3px;transition:width .5s ease;}
.bars-wrap{padding:20px;}
.bars-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.bars-head h3{font-size:14px;font-weight:500;}
.bar-area{display:flex;align-items:flex-end;gap:7px;height:90px;}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.bfill{width:100%;border-radius:5px 5px 0 0;cursor:pointer;transition:opacity .15s;}
.bfill:hover{opacity:.8;}
.blbl{font-size:10px;color:var(--t3);}
.bval{font-size:10px;color:var(--t2);}
.overlay{display:none;position:fixed;inset:0;background:rgba(5,5,15,0.75);backdrop-filter:blur(12px);z-index:50;align-items:center;justify-content:center;}
.overlay.open{display:flex;}
.modal{background:rgba(18,18,30,0.96);border:1px solid rgba(255,255,255,0.15);border-radius:22px;padding:26px;width:420px;max-width:96%;position:relative;}
.modal::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);}
.modal h2{font-size:16px;font-weight:500;margin-bottom:18px;}
.fg{margin-bottom:14px;}
.fg label{font-size:11px;color:var(--t3);display:block;margin-bottom:5px;letter-spacing:.04em;}
.fg input,.fg select,.fg textarea{width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:9px;padding:9px 11px;color:var(--t1);font-size:13px;font-family:inherit;outline:none;transition:border .15s;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:rgba(212,169,106,0.45);}
.fg textarea{resize:vertical;min-height:60px;}
.fg select option{background:#14141e;}
.fg-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.m-actions{display:flex;gap:9px;margin-top:20px;}
.btn-ok{flex:1;padding:10px;background:rgba(212,169,106,0.22);border:1px solid rgba(212,169,106,0.4);color:var(--gold);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-ok:hover{background:rgba(212,169,106,0.32);}
.btn-cl{flex:0 0 72px;padding:10px;background:var(--g1);border:1px solid var(--gb);color:var(--t2);border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;}
.btn-del{flex:0 0 72px;padding:10px;background:rgba(212,122,122,0.15);border:1px solid rgba(212,122,122,0.3);color:var(--red);border-radius:10px;font-size:13px;cursor:pointer;font-family:inherit;}
.detail-panel{display:none;position:fixed;top:0;right:0;bottom:0;width:340px;z-index:40;padding:20px;background:rgba(12,12,22,0.95);border-left:1px solid rgba(255,255,255,0.12);backdrop-filter:blur(30px);overflow-y:auto;}
.detail-panel.open{display:block;}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.dp-head h3{font-size:15px;font-weight:500;}
.close-dp{background:none;border:none;color:var(--t2);cursor:pointer;font-size:20px;padding:4px;}
.report-section{padding:4px;}
.report-month{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.rcard{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px;}
.rcard-l{font-size:11px;color:var(--t3);margin-bottom:5px;}
.rcard-v{font-size:20px;font-weight:500;letter-spacing:-0.5px;}
.report-bars{margin-top:8px;}
.rb-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rb-name{font-size:12px;color:var(--t2);width:60px;flex-shrink:0;}
.rb-bg{flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.rb-fill{height:100%;border-radius:3px;}
.rb-val{font-size:11px;color:var(--t3);width:36px;text-align:right;flex-shrink:0;}
.export-row{display:flex;gap:8px;margin-top:14px;}
.exp-btn{flex:1;padding:9px;background:var(--g1);border:1px solid var(--gb);border-radius:9px;color:var(--t2);font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:5px;transition:all .15s;}
.exp-btn:hover{background:rgba(255,255,255,0.1);color:var(--t1);}
.toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(18,18,30,0.95);border:1px solid rgba(255,255,255,0.15);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--t1);z-index:100;white-space:nowrap;}
.toast.show{display:block;}
</style>
</head>
<body>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="bg-orb o3"></div>

<div class="app" id="app">
<nav class="sidebar glass">
  <div class="logo">worklog <small>작업 시간 트래커</small></div>
  <button class="nav-btn on" onclick="setNav(this,'dash')"><i class="ti ti-layout-dashboard"></i>대시보드</button>
  <button class="nav-btn" onclick="setNav(this,'report')"><i class="ti ti-report-analytics"></i>월간 리포트</button>
  <button class="nav-btn" onclick="setNav(this,'tasks')"><i class="ti ti-checkbox"></i>작업 목록</button>
  <div class="sec-label">카테고리</div>
  <div class="tag-li" onclick="filterCat('전체')"><div class="dot" style="background:rgba(255,255,255,0.3)"></div>전체</div>
  <div class="tag-li" onclick="filterCat('촬영')"><div class="dot" style="background:#d4a96a"></div>촬영</div>
  <div class="tag-li" onclick="filterCat('편집')"><div class="dot" style="background:#8fb3d4"></div>편집</div>
  <div class="tag-li" onclick="filterCat('미팅')"><div class="dot" style="background:#7ec49a"></div>미팅</div>
  <div class="tag-li" onclick="filterCat('납품')"><div class="dot" style="background:#d47a7a"></div>납품</div>
  <div class="sb-space"></div>
  <button class="add-main" onclick="openAdd()"><i class="ti ti-plus"></i>작업 추가</button>
</nav>

<div class="topbar">
  <h1 id="view-title">이번 주 현황</h1>
  <div class="tabs">
    <button class="tab on" id="tw" onclick="switchTab('week',this)"><i class="ti ti-calendar-week"></i>주간</button>
    <button class="tab" id="tm" onclick="switchTab('month',this)"><i class="ti ti-calendar-month"></i>월간</button>
  </div>
</div>

<div class="main" id="main-dash">
  <div class="stat-row">
    <div class="stat glass"><div class="stat-lbl"><i class="ti ti-clock"></i>총 작업 시간</div><div class="stat-num" id="s-hours">–</div><div class="stat-hint up" id="s-hint1">계산 중</div></div>
    <div class="stat glass"><div class="stat-lbl"><i class="ti ti-checkbox"></i>완료 작업</div><div class="stat-num" id="s-done">–</div><div class="stat-hint" id="s-hint2">–</div></div>
    <div class="stat glass"><div class="stat-lbl"><i class="ti ti-bolt"></i>평균 효율</div><div class="stat-num" id="s-eff">–</div><div class="stat-hint up">집중도</div></div>
    <div class="stat glass"><div class="stat-lbl"><i class="ti ti-camera"></i>프로젝트</div><div class="stat-num" id="s-proj">–</div><div class="stat-hint">진행 중</div></div>
  </div>
  <div class="mid">
    <div class="cal-wrap glass">
      <div class="cal-head">
        <span class="cal-title" id="cal-lbl"></span>
        <div class="cal-nav">
          <button onclick="prevMo()"><i class="ti ti-chevron-left"></i></button>
          <button onclick="nextMo()"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
      <div class="cal-grid" id="cgrid"></div>
    </div>
    <div class="panel">
      <div class="pcard glass">
        <div class="pcard-title"><i class="ti ti-hourglass"></i>타이머</div>
        <div class="timer-display">
          <div class="timer-num" id="tmr-display">00:00:00</div>
          <div class="timer-task" id="tmr-task">작업을 선택하거나 직접 시작</div>
        </div>
        <div style="margin-top:10px;">
          <div class="fg"><input type="text" id="tmr-name" placeholder="타이머 작업명..." style="font-size:12px;padding:7px 10px;"/></div>
          <div class="fg" style="margin-bottom:0;"><select id="tmr-cat" style="font-size:12px;padding:7px 10px;"><option>촬영</option><option>편집</option><option>미팅</option><option>납품</option></select></div>
        </div>
        <div class="timer-btns">
          <button class="tbtn start" id="tbtn-start" onclick="timerStart()"><i class="ti ti-player-play"></i>시작</button>
          <button class="tbtn stop" id="tbtn-stop" onclick="timerStop()" style="display:none"><i class="ti ti-player-pause"></i>정지</button>
          <button class="tbtn save-t" id="tbtn-save" onclick="timerSave()" style="display:none"><i class="ti ti-device-floppy"></i>저장</button>
        </div>
      </div>
      <div class="pcard glass" style="flex:1;">
        <div class="pcard-title"><i class="ti ti-list-check"></i>오늘 작업</div>
        <div id="today-tasks"></div>
      </div>
    </div>
  </div>
  <div class="bars-wrap glass">
    <div class="bars-head"><h3>일별 작업 시간</h3><span style="font-size:11px;color:var(--t3)">단위: 시간</span></div>
    <div class="bar-area" id="barchart"></div>
  </div>
  <div class="pcard glass">
    <div class="pcard-title"><i class="ti ti-chart-pie"></i>카테고리별 비중</div>
    <div id="eff-cats"></div>
  </div>
</div>

<div class="main" id="main-report" style="display:none;">
  <div class="pcard glass report-section">
    <div class="report-month">
      <span style="font-size:15px;font-weight:500;" id="rpt-title">리포트</span>
      <div style="display:flex;gap:8px;">
        <button class="tab" onclick="rptPrev()"><i class="ti ti-chevron-left"></i></button>
        <button class="tab" onclick="rptNext()"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div class="report-grid" id="rpt-stats"></div>
    <div style="font-size:12px;color:var(--t3);margin:14px 0 8px;">카테고리별 시간 비중</div>
    <div class="report-bars" id="rpt-bars"></div>
    <div style="font-size:12px;color:var(--t3);margin:14px 0 8px;">일별 작업 현황</div>
    <div id="rpt-daily"></div>
    <div class="export-row">
      <button class="exp-btn" onclick="exportJSON()"><i class="ti ti-download"></i>JSON 백업</button>
      <button class="exp-btn" onclick="exportCSV()"><i class="ti ti-file-spreadsheet"></i>CSV 내보내기</button>
      <button class="exp-btn" onclick="importTrigger()"><i class="ti ti-upload"></i>JSON 복원</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)"/>
  </div>
</div>

<div class="main" id="main-tasks" style="display:none;">
  <div class="pcard glass">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
      <span style="font-size:14px;font-weight:500;">전체 작업 목록</span>
      <button class="tab on" style="font-size:11px;" onclick="openAdd()"><i class="ti ti-plus"></i>추가</button>
    </div>
    <div id="all-tasks"></div>
  </div>
</div>

<div class="overlay" id="add-overlay">
  <div class="modal">
    <h2 id="modal-title">새 작업 추가</h2>
    <div class="fg"><label>작업명</label><input type="text" id="f-name" placeholder="예: 본식 사진 편집"/></div>
    <div class="fg-row">
      <div class="fg"><label>날짜</label><input type="date" id="f-date"/></div>
      <div class="fg"><label>소요 시간 (h)</label><input type="number" id="f-hours" placeholder="3.5" step="0.5" min="0.5" max="24"/></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>카테고리</label><select id="f-cat"><option>촬영</option><option>편집</option><option>미팅</option><option>납품</option></select></div>
      <div class="fg"><label>집중도 (%)</label><input type="number" id="f-eff" placeholder="80" min="10" max="100"/></div>
    </div>
    <div class="fg"><label>메모</label><textarea id="f-memo" placeholder="작업 내용 메모..."></textarea></div>
    <div class="m-actions">
      <button class="btn-cl" onclick="closeAdd()">취소</button>
      <button class="btn-del" id="del-btn" style="display:none" onclick="deleteTask()">삭제</button>
      <button class="btn-ok" onclick="saveTask()"><i class="ti ti-check"></i>저장</button>
    </div>
  </div>
</div>

<div class="detail-panel glass" id="detail-panel">
  <div class="dp-head">
    <h3>작업 상세</h3>
    <button class="close-dp" onclick="closeDetail()"><i class="ti ti-x"></i></button>
  </div>
  <div id="dp-content"></div>
</div>

<div class="toast" id="toast"></div>
</div>

<script>
const CC={촬영:'#d4a96a',편집:'#8fb3d4',미팅:'#7ec49a',납품:'#d47a7a'};
const today=new Date();
let CY=today.getFullYear(),CM=today.getMonth();
let selDay=today.getDate();
let editId=null;
let rptYear=today.getFullYear(),rptMonth=today.getMonth();
let tasks=loadTasks();
function loadTasks(){
  try{const s=localStorage.getItem('wl_tasks');if(s)return JSON.parse(s);}catch(e){}
  return [
    {id:1,name:'본식 사진 셀렉',date:'2025-06-02',hours:3.5,cat:'편집',eff:90,done:true,memo:'400장 1차 셀렉 완료'},
    {id:2,name:'스튜디오 리허설 촬영',date:'2025-06-03',hours:5,cat:'촬영',eff:85,done:true,memo:''},
    {id:3,name:'영상 1차 편집',date:'2025-06-03',hours:4,cat:'편집',eff:78,done:false,memo:'브금 선정 필요'},
    {id:4,name:'클라이언트 미팅',date:'2025-06-04',hours:1.5,cat:'미팅',eff:95,done:false,memo:'스타일 컨펌'},
    {id:5,name:'야외 촬영 — 북촌',date:'2025-06-04',hours:6,cat:'촬영',eff:82,done:false,memo:''},
    {id:6,name:'컬러 그레이딩',date:'2025-06-05',hours:3,cat:'편집',eff:88,done:true,memo:''},
    {id:7,name:'최종 영상 납품',date:'2025-06-06',hours:1,cat:'납품',eff:100,done:true,memo:'드라이브 전송'},
    {id:8,name:'스냅 리허설 촬영',date:'2025-06-07',hours:4.5,cat:'촬영',eff:80,done:false,memo:''},
  ];
}
function saveTasks(){try{localStorage.setItem('wl_tasks',JSON.stringify(tasks));}catch(e){}}
let nid=Math.max(...tasks.map(t=>t.id),0)+1;
let catFilter='전체';
function ds(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function todayStr(){return ds(today.getFullYear(),today.getMonth(),today.getDate());}
function setNav(btn,view){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('main-dash').style.display=view==='dash'?'flex':'none';
  document.getElementById('main-report').style.display=view==='report'?'flex':'none';
  document.getElementById('main-tasks').style.display=view==='tasks'?'flex':'none';
  document.getElementById('view-title').textContent=view==='dash'?'이번 주 현황':view==='report'?'월간 리포트':'작업 목록';
  if(view==='report')renderReport();
  if(view==='tasks')renderAllTasks();
}
function switchTab(t,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function filterCat(c){catFilter=c;renderTodayTasks();renderAllTasks();}
function renderCalendar(){
  document.getElementById('cal-lbl').textContent=`${CY}년 ${CM+1}월`;
  const g=document.getElementById('cgrid');g.innerHTML='';
  ['일','월','화','수','목','금','토'].forEach(d=>{const e=document.createElement('div');e.className='dow';e.textContent=d;g.appendChild(e);});
  const first=new Date(CY,CM,1).getDay();
  const last=new Date(CY,CM+1,0).getDate();
  const prev=new Date(CY,CM,0).getDate();
  for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day oth';e.textContent=prev-first+1+i;g.appendChild(e);}
  for(let d=1;d<=last;d++){
    const e=document.createElement('div');e.className='day';
    const dstr=ds(CY,CM,d);
    const dt=tasks.filter(t=>t.date===dstr);
    const h=dt.reduce((a,t)=>a+t.hours,0);
    if(d===today.getDate()&&CY===today.getFullYear()&&CM===today.getMonth())e.classList.add('td');
    if(d===selDay&&CY===today.getFullYear()&&CM===today.getMonth())e.classList.add('sel');
    e.innerHTML=`<span>${d}</span>`;
    if(h>5){const dot=document.createElement('div');dot.className='cd';dot.style.background=CC['촬영'];e.appendChild(dot);}
    else if(h>2){const dot=document.createElement('div');dot.className='cd';dot.style.background=CC['편집'];e.appendChild(dot);}
    else if(h>0){const dot=document.createElement('div');dot.className='cd';dot.style.background='rgba(255,255,255,0.2)';e.appendChild(dot);}
    e.onclick=()=>selectDay(d);
    g.appendChild(e);
  }
  const rem=(7-((first+last)%7))%7;
  for(let i=1;i<=rem;i++){const e=document.createElement('div');e.className='day oth';e.textContent=i;g.appendChild(e);}
}
function selectDay(d){selDay=d;renderCalendar();renderTodayTasks();}
function prevMo(){CM--;if(CM<0){CM=11;CY--;}renderCalendar();}
function nextMo(){CM++;if(CM>11){CM=0;CY++;}renderCalendar();}
function renderTodayTasks(){
  const el=document.getElementById('today-tasks');
  const ts=tasks.filter(t=>t.date===todayStr()&&(catFilter==='전체'||t.cat===catFilter));
  if(!ts.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);text-align:center;padding:14px 0;">오늘 작업 없음</div>';return;}
  el.innerHTML=ts.map(t=>`
    <div class="task-li" onclick="openDetail(${t.id})">
      <div class="chk ${t.done?'done':''}" onclick="event.stopPropagation();toggleDone(${t.id})"></div>
      <div style="flex:1;min-width:0;">
        <div class="ti-name ${t.done?'done':''}">${t.name}</div>
        <div class="ti-meta">
          <span><i class="ti ti-clock" style="font-size:10px;"></i> ${t.hours}h</span>
          <span class="ctag" style="background:${CC[t.cat]}22;color:${CC[t.cat]}">${t.cat}</span>
          <span>${t.eff}%</span>
        </div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:14px;color:var(--t3);flex-shrink:0;"></i>
    </div>`).join('');
}
function renderStats(){
  const total=tasks.reduce((a,t)=>a+t.hours,0);
  const done=tasks.filter(t=>t.done).length;
  const avg=tasks.length?Math.round(tasks.reduce((a,t)=>a+t.eff,0)/tasks.length):0;
  const cats=new Set(tasks.map(t=>t.cat)).size;
  document.getElementById('s-hours').textContent=total.toFixed(1)+'h';
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-hint2').textContent=`전체 ${tasks.length}개 중`;
  document.getElementById('s-eff').textContent=avg+'%';
  document.getElementById('s-proj').textContent=cats;
}
function renderEff(){
  const el=document.getElementById('eff-cats');
  const cats=['촬영','편집','미팅','납품'];
  const total=tasks.reduce((a,t)=>a+t.hours,0)||1;
  el.innerHTML=cats.map(c=>{
    const h=tasks.filter(t=>t.cat===c).reduce((a,t)=>a+t.hours,0);
    const p=Math.round(h/total*100);
    return `<div class="eff-row"><div class="eff-top"><span>${c}</span><span style="color:var(--t3)">${h.toFixed(1)}h · ${p}%</span></div><div class="eff-bg"><div class="eff-fill" style="width:${p}%;background:${CC[c]}"></div></div></div>`;
  }).join('');
}
function renderBars(){
  const el=document.getElementById('barchart');
  const days=['월','화','수','목','금','토','일'];
  const data=[5.5,7,7.5,6,8,4,0.5];
  const max=Math.max(...data)||1;
  el.innerHTML=data.map((v,i)=>`
    <div class="bcol">
      <div class="bval">${v}h</div>
      <div class="bfill" style="height:${Math.round(v/max*72+6)}px;background:${i===3?CC['촬영']:'rgba(255,255,255,0.12)'}"></div>
      <div class="blbl">${days[i]}</div>
    </div>`).join('');
}
function renderAllTasks(){
  const el=document.getElementById('all-tasks');if(!el)return;
  const ts=tasks.filter(t=>catFilter==='전체'||t.cat===catFilter);
  if(!ts.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);padding:14px 0;">작업 없음</div>';return;}
  el.innerHTML=ts.map(t=>`
    <div class="task-li" onclick="openDetail(${t.id})">
      <div class="chk ${t.done?'done':''}" onclick="event.stopPropagation();toggleDone(${t.id})"></div>
      <div style="flex:1;min-width:0;">
        <div class="ti-name ${t.done?'done':''}">${t.name}</div>
        <div class="ti-meta">
          <span style="color:var(--t3)">${t.date}</span>
          <span><i class="ti ti-clock" style="font-size:10px;"></i>${t.hours}h</span>
          <span class="ctag" style="background:${CC[t.cat]}22;color:${CC[t.cat]}">${t.cat}</span>
          <span>${t.eff}%</span>
        </div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:14px;color:var(--t3);"></i>
    </div>`).join('');
}
function openDetail(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const dp=document.getElementById('detail-panel');
  document.getElementById('dp-content').innerHTML=`
    <div class="glass-inner" style="padding:16px;margin-bottom:14px;">
      <div style="font-size:16px;font-weight:500;margin-bottom:8px;">${t.name}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <span class="ctag" style="background:${CC[t.cat]}22;color:${CC[t.cat]};padding:3px 10px;border-radius:6px;">${t.cat}</span>
        <span class="ctag" style="background:rgba(255,255,255,0.07);color:var(--t2);padding:3px 10px;border-radius:6px;">${t.done?'완료':'진행 중'}</span>
      </div>
    </div>
    <div class="eff-row" style="margin-bottom:14px;">
      <div class="eff-top"><span>집중도</span><span style="color:${CC[t.cat]}">${t.eff}%</span></div>
      <div class="eff-bg"><div class="eff-fill" style="width:${t.eff}%;background:${CC[t.cat]}"></div></div>
    </div>
    <table style="width:100%;font-size:13px;border-collapse:separate;border-spacing:0 6px;">
      <tr><td style="color:var(--t3);padding:4px 0;"><i class="ti ti-calendar" style="font-size:13px;margin-right:6px;"></i>날짜</td><td style="text-align:right;">${t.date}</td></tr>
      <tr><td style="color:var(--t3);padding:4px 0;"><i class="ti ti-clock" style="font-size:13px;margin-right:6px;"></i>소요 시간</td><td style="text-align:right;color:var(--gold)">${t.hours}h</td></tr>
    </table>
    ${t.memo?`<div style="margin-top:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px;font-size:12px;color:var(--t2);line-height:1.6;">${t.memo}</div>`:''}
    <div style="display:flex;gap:8px;margin-top:18px;">
      <button class="exp-btn" style="flex:1;" onclick="openEdit(${t.id})"><i class="ti ti-edit"></i>편집</button>
      <button class="exp-btn" onclick="toggleDone(${t.id});openDetail(${t.id})"><i class="ti ti-check"></i>${t.done?'미완료로':'완료'}</button>
    </div>`;
  dp.classList.add('open');
}
function closeDetail(){document.getElementById('detail-panel').classList.remove('open');}
function openAdd(){
  editId=null;
  document.getElementById('modal-title').textContent='새 작업 추가';
  document.getElementById('del-btn').style.display='none';
  document.getElementById('f-name').value='';
  document.getElementById('f-date').value=todayStr();
  document.getElementById('f-hours').value='';
  document.getElementById('f-eff').value='';
  document.getElementById('f-memo').value='';
  document.getElementById('add-overlay').classList.add('open');
}
function openEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  editId=id;
  document.getElementById('modal-title').textContent='작업 편집';
  document.getElementById('del-btn').style.display='block';
  document.getElementById('f-name').value=t.name;
  document.getElementById('f-date').value=t.date;
  document.getElementById('f-hours').value=t.hours;
  document.getElementById('f-cat').value=t.cat;
  document.getElementById('f-eff').value=t.eff;
  document.getElementById('f-memo').value=t.memo||'';
  document.getElementById('add-overlay').classList.add('open');
}
function closeAdd(){document.getElementById('add-overlay').classList.remove('open');}
function saveTask(){
  const name=document.getElementById('f-name').value.trim();
  const date=document.getElementById('f-date').value;
  const hours=parseFloat(document.getElementById('f-hours').value)||2;
  const cat=document.getElementById('f-cat').value;
  const eff=parseInt(document.getElementById('f-eff').value)||80;
  const memo=document.getElementById('f-memo').value.trim();
  if(!name||!date)return;
  if(editId){const t=tasks.find(x=>x.id===editId);if(t)Object.assign(t,{name,date,hours,cat,eff,memo});}
  else{tasks.push({id:nid++,name,date,hours,cat,eff,done:false,memo});}
  saveTasks();closeAdd();refresh();
  toast(editId?'작업이 수정되었습니다':'작업이 추가되었습니다');
}
function deleteTask(){
  if(!editId)return;
  tasks=tasks.filter(t=>t.id!==editId);
  saveTasks();closeAdd();closeDetail();refresh();toast('작업이 삭제되었습니다');
}
function toggleDone(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;saveTasks();refresh();}}
function refresh(){renderCalendar();renderTodayTasks();renderStats();renderEff();renderBars();renderAllTasks();}
let timerInterval=null,timerStart_=0,timerElapsed=0,timerRunning=false;
function timerStart(){
  if(timerRunning)return;
  timerRunning=true;timerStart_=Date.now()-timerElapsed*1000;
  timerInterval=setInterval(()=>{
    timerElapsed=Math.floor((Date.now()-timerStart_)/1000);
    const h=Math.floor(timerElapsed/3600),m=Math.floor((timerElapsed%3600)/60),s=timerElapsed%60;
    document.getElementById('tmr-display').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  },1000);
  const n=document.getElementById('tmr-name').value||'타이머 작업';
  document.getElementById('tmr-task').textContent=`진행 중: ${n}`;
  document.getElementById('tbtn-start').style.display='none';
  document.getElementById('tbtn-stop').style.display='flex';
  document.getElementById('tbtn-save').style.display='none';
}
function timerStop(){
  clearInterval(timerInterval);timerRunning=false;
  document.getElementById('tbtn-stop').style.display='none';
  document.getElementById('tbtn-start').style.display='flex';
  document.getElementById('tbtn-save').style.display='flex';
  document.getElementById('tmr-task').textContent='저장하거나 다시 시작하세요';
}
function timerSave(){
  if(!timerElapsed)return;
  const h=Math.max(0.5,parseFloat((timerElapsed/3600).toFixed(1)));
  const name=document.getElementById('tmr-name').value.trim()||'타이머 작업';
  const cat=document.getElementById('tmr-cat').value;
  tasks.push({id:nid++,name,date:todayStr(),hours:h,cat,eff:80,done:false,memo:`타이머 ${Math.floor(timerElapsed/60)}분 기록`});
  saveTasks();timerElapsed=0;timerRunning=false;
  document.getElementById('tmr-display').textContent='00:00:00';
  document.getElementById('tmr-task').textContent='저장 완료!';
  document.getElementById('tbtn-save').style.display='none';
  document.getElementById('tbtn-start').style.display='flex';
  refresh();toast(`${h}h 작업이 저장되었습니다`);
}
function renderReport(){
  document.getElementById('rpt-title').textContent=`${rptYear}년 ${rptMonth+1}월 리포트`;
  const mt=tasks.filter(t=>{const d=new Date(t.date);return d.getFullYear()===rptYear&&d.getMonth()===rptMonth;});
  const total=mt.reduce((a,t)=>a+t.hours,0);
  const done=mt.filter(t=>t.done).length;
  const avg=mt.length?Math.round(mt.reduce((a,t)=>a+t.eff,0)/mt.length):0;
  const days=new Set(mt.map(t=>t.date)).size;
  document.getElementById('rpt-stats').innerHTML=`
    <div class="rcard"><div class="rcard-l">총 작업 시간</div><div class="rcard-v" style="color:var(--gold)">${total.toFixed(1)}h</div></div>
    <div class="rcard"><div class="rcard-l">완료 작업</div><div class="rcard-v">${done}건</div></div>
    <div class="rcard"><div class="rcard-l">평균 집중도</div><div class="rcard-v" style="color:var(--green)">${avg}%</div></div>
    <div class="rcard"><div class="rcard-l">작업 일수</div><div class="rcard-v">${days}일</div></div>`;
  const cats=['촬영','편집','미팅','납품'];
  const ctotal=total||1;
  document.getElementById('rpt-bars').innerHTML=cats.map(c=>{
    const h=mt.filter(t=>t.cat===c).reduce((a,t)=>a+t.hours,0);
    const p=Math.round(h/ctotal*100);
    return `<div class="rb-row"><div class="rb-name">${c}</div><div class="rb-bg"><div class="rb-fill" style="width:${p}%;background:${CC[c]}"></div></div><div class="rb-val">${h.toFixed(1)}h</div></div>`;
  }).join('');
  const lastDay=new Date(rptYear,rptMonth+1,0).getDate();
  let dailyHTML='';
  for(let d=1;d<=lastDay;d++){
    const dstr=ds(rptYear,rptMonth,d);
    const dt=mt.filter(t=>t.date===dstr);
    if(!dt.length)continue;
    const h=dt.reduce((a,t)=>a+t.hours,0);
    const p=Math.round(h/8*100);
    dailyHTML+=`<div class="rb-row"><div class="rb-name" style="font-size:11px;">${rptMonth+1}/${d}</div><div class="rb-bg"><div class="rb-fill" style="width:${Math.min(p,100)}%;background:rgba(212,169,106,0.6)"></div></div><div class="rb-val">${h.toFixed(1)}h</div></div>`;
  }
  document.getElementById('rpt-daily').innerHTML=dailyHTML||'<div style="font-size:12px;color:var(--t3);padding:8px 0;">이 달 작업 없음</div>';
}
function rptPrev(){rptMonth--;if(rptMonth<0){rptMonth=11;rptYear--;}renderReport();}
function rptNext(){rptMonth++;if(rptMonth>11){rptMonth=0;rptYear++;}renderReport();}
function exportJSON(){
  const blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`worklog_backup_${todayStr()}.json`;a.click();
  toast('JSON 백업 파일이 다운로드되었습니다');
}
function exportCSV(){
  const rows=[['id','name','date','hours','cat','eff','done','memo'],...tasks.map(t=>[t.id,t.name,t.date,t.hours,t.cat,t.eff,t.done,t.memo||''])];
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`worklog_${todayStr()}.csv`;a.click();
  toast('CSV 파일이 다운로드되었습니다');
}
function importTrigger(){document.getElementById('import-file').click();}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(Array.isArray(data)){tasks=data;nid=Math.max(...tasks.map(t=>t.id),0)+1;saveTasks();refresh();toast('데이터가 복원되었습니다');}
    }catch(err){toast('파일 형식 오류');}
  };
  reader.readAsText(file);e.target.value='';
}
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2500);
}
document.getElementById('add-overlay').addEventListener('click',e=>{if(e.target.id==='add-overlay')closeAdd();});
refresh();
</script>
</body>
</html>
